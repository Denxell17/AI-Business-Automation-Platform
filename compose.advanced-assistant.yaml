# Opt-in overlay, reviewed separately from public RAG. No provider enabled by default.
# Use with compose.deploy.yaml; the base image already contains application modules.
services:
  web:
    environment:
      ABAP_ADVANCED_ASSISTANT_ENABLED: ${ABAP_ADVANCED_ASSISTANT_ENABLED:-false}
      ABAP_ASSISTANT_REMOTE_APPROVED: ${ABAP_ASSISTANT_REMOTE_APPROVED:-false}
      ABAP_ASSISTANT_GEMINI_MODELS: ${ABAP_ASSISTANT_GEMINI_MODELS:-}
      ABAP_ASSISTANT_GEMINI_KEY: ${ABAP_ASSISTANT_GEMINI_KEY:-}
      ABAP_ASSISTANT_OPENROUTER_MODELS: ${ABAP_ASSISTANT_OPENROUTER_MODELS:-}
      ABAP_ASSISTANT_OPENROUTER_KEY: ${ABAP_ASSISTANT_OPENROUTER_KEY:-}
      ABAP_ASSISTANT_COMPATIBLE_MODELS: ${ABAP_ASSISTANT_COMPATIBLE_MODELS:-}
      ABAP_ASSISTANT_COMPATIBLE_KEY: ${ABAP_ASSISTANT_COMPATIBLE_KEY:-}
      ABAP_ASSISTANT_COMPATIBLE_URL: ${ABAP_ASSISTANT_COMPATIBLE_URL:-}
      ABAP_ASSISTANT_N8N_WORKFLOWS: ${ABAP_ASSISTANT_N8N_WORKFLOWS:-}
      ABAP_ASSISTANT_ALLOW_LOCAL_DEVELOPMENT: "false"
      ABAP_ASSISTANT_CLOUD_VALIDATION_FILE: ${ABAP_ASSISTANT_CLOUD_VALIDATION_FILE:-}
      ABAP_ASSISTANT_GEMINI_FREE_ACCOUNT_REVIEWED: ${ABAP_ASSISTANT_GEMINI_FREE_ACCOUNT_REVIEWED:-false}
      ABAP_ASSISTANT_GEMINI_FREE_MODELS: ${ABAP_ASSISTANT_GEMINI_FREE_MODELS:-}
      ABAP_ASSISTANT_COMPATIBLE_FREE_ACCOUNT_REVIEWED: ${ABAP_ASSISTANT_COMPATIBLE_FREE_ACCOUNT_REVIEWED:-false}
      ABAP_ASSISTANT_COMPATIBLE_FREE_MODELS: ${ABAP_ASSISTANT_COMPATIBLE_FREE_MODELS:-}
      ABAP_ASSISTANT_USER_DAILY_LIMIT: ${ABAP_ASSISTANT_USER_DAILY_LIMIT:-100}
      ABAP_ASSISTANT_USER_MODEL_DAILY_LIMIT: ${ABAP_ASSISTANT_USER_MODEL_DAILY_LIMIT:-20}
      ABAP_ASSISTANT_MODEL_DAILY_LIMIT: ${ABAP_ASSISTANT_MODEL_DAILY_LIMIT:-40}
      ABAP_ASSISTANT_PROVIDER_DAILY_LIMIT: ${ABAP_ASSISTANT_PROVIDER_DAILY_LIMIT:-40}
      ABAP_ASSISTANT_GLOBAL_DAILY_LIMIT: ${ABAP_ASSISTANT_GLOBAL_DAILY_LIMIT:-1000}
      ABAP_ASSISTANT_USER_PER_MINUTE: ${ABAP_ASSISTANT_USER_PER_MINUTE:-10}
      ABAP_ASSISTANT_MODEL_PER_MINUTE: ${ABAP_ASSISTANT_MODEL_PER_MINUTE:-20}
      ABAP_ASSISTANT_PROVIDER_PER_MINUTE: ${ABAP_ASSISTANT_PROVIDER_PER_MINUTE:-20}
      ABAP_ASSISTANT_GLOBAL_PER_MINUTE: ${ABAP_ASSISTANT_GLOBAL_PER_MINUTE:-60}
      ABAP_ASSISTANT_USER_CONCURRENCY: ${ABAP_ASSISTANT_USER_CONCURRENCY:-1}
      ABAP_ASSISTANT_MODEL_CONCURRENCY: ${ABAP_ASSISTANT_MODEL_CONCURRENCY:-2}
      ABAP_ASSISTANT_PROVIDER_CONCURRENCY: ${ABAP_ASSISTANT_PROVIDER_CONCURRENCY:-2}
      ABAP_ASSISTANT_GLOBAL_CONCURRENCY: ${ABAP_ASSISTANT_GLOBAL_CONCURRENCY:-4}
      ABAP_ASSISTANT_DEMO_ONLY: "true"
