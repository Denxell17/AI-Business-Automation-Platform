<!DOCTYPE html>
<html
    lang="{{ interface_language }}"
    dir="{{ text_direction }}"
    data-light-theme-label="{{ _('Light theme') }}"
    data-dark-theme-label="{{ _('Dark theme') }}"
    data-use-light-theme-label="{{ _('Use light theme') }}"
    data-use-dark-theme-label="{{ _('Use dark theme') }}"
    data-open-navigation-label="{{ _('Open navigation') }}"
    data-close-navigation-label="{{ _('Close navigation') }}"
    data-recorded-timestamp-label="{{ _('Recorded timestamp:') }}"
>
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        {% block title %}{{ page_title_label(page_title) }}{% endblock %} | ABAP
    </title>
    <script src="{{ url_for('static', path='/theme.js') }}"></script>
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/styles.css') }}?v={{ stylesheet_version }}"
    >
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">
        {{ _("Skip to main content") }}
    </a>

    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
