name: abap

services:
  database:
    image: postgres:18.6
    container_name: abap-postgresql
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - abap_postgresql_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  abap_postgresql_data: