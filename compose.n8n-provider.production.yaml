name: abap-deploy

# Production-only ABAP overlay. It does not alter or import n8n workflows and
# the integration remains globally disabled by compose.hosthatch.yaml.
services:
  n8n-provider:
    image: abap:${ABAP_IMAGE_TAG:?Pin the reviewed ABAP release tag}
    profiles: ["integrations"]
    command: ["python", "-m", "n8n_demo_provider"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      ABAP_OUTBOUND_WEBHOOK_SECRET: ${ABAP_OUTBOUND_WEBHOOK_SECRET:?Set the outbound signing secret}
      ABAP_INBOUND_WEBHOOK_SECRET: ${ABAP_INBOUND_WEBHOOK_SECRET:?Set the inbound signing secret}
      ABAP_CALLBACK_URL: http://web:8000/integrations/webhooks/callback
      ABAP_WEBHOOK_SIGNATURE_TTL_SECONDS: ${ABAP_WEBHOOK_SIGNATURE_TTL_SECONDS:-300}
      ABAP_N8N_DEMO_LEASE_SECONDS: ${ABAP_N8N_DEMO_LEASE_SECONDS:-30}
      ABAP_N8N_DEMO_MAX_ATTEMPTS: ${ABAP_N8N_DEMO_MAX_ATTEMPTS:-3}
      ABAP_N8N_CALLBACK_MAX_ATTEMPTS: ${ABAP_N8N_CALLBACK_MAX_ATTEMPTS:-3}
      ABAP_N8N_CALLBACK_TIMEOUT_SECONDS: ${ABAP_N8N_CALLBACK_TIMEOUT_SECONDS:-3}
      ABAP_N8N_CALLBACK_RETRY_WAIT_SECONDS: ${ABAP_N8N_CALLBACK_RETRY_WAIT_SECONDS:-1}
    secrets:
      - abap_n8n_provider_token
    networks:
      - default
      - abap_n8n_private
    cpus: 0.15
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 5s

networks:
  abap_n8n_private:
    name: abap_n8n_private
    external: true

secrets:
  abap_n8n_provider_token:
    file: ${ABAP_N8N_PROVIDER_TOKEN_FILE:?Set the protected provider-token file path}
