name: abap-deploy

x-integration-environment: &integration-environment
  ABAP_INTEGRATIONS_ENABLED: ${ABAP_INTEGRATIONS_ENABLED:-false}
  ABAP_N8N_PRIVATE_DEVELOPMENT_NETWORK: ${ABAP_N8N_PRIVATE_DEVELOPMENT_NETWORK:-false}
  ABAP_N8N_BASE_URL: ${ABAP_N8N_BASE_URL:-}
  ABAP_N8N_WORKFLOW_PATH: ${ABAP_N8N_WORKFLOW_PATH:-}
  ABAP_INTEGRATION_ALLOWED_HOSTS: ${ABAP_INTEGRATION_ALLOWED_HOSTS:-}
  ABAP_OUTBOUND_WEBHOOK_SECRET: ${ABAP_OUTBOUND_WEBHOOK_SECRET:-}
  ABAP_INBOUND_WEBHOOK_SECRET: ${ABAP_INBOUND_WEBHOOK_SECRET:-}
  ABAP_WEBHOOK_CONNECT_TIMEOUT_SECONDS: ${ABAP_WEBHOOK_CONNECT_TIMEOUT_SECONDS:-3}
  ABAP_WEBHOOK_READ_TIMEOUT_SECONDS: ${ABAP_WEBHOOK_READ_TIMEOUT_SECONDS:-15}
  ABAP_WEBHOOK_MAX_REQUEST_BYTES: ${ABAP_WEBHOOK_MAX_REQUEST_BYTES:-262144}
  ABAP_WEBHOOK_MAX_RESPONSE_BYTES: ${ABAP_WEBHOOK_MAX_RESPONSE_BYTES:-262144}
  ABAP_WEBHOOK_SIGNATURE_TTL_SECONDS: ${ABAP_WEBHOOK_SIGNATURE_TTL_SECONDS:-300}
  ABAP_WEBHOOK_MAX_ATTEMPTS: ${ABAP_WEBHOOK_MAX_ATTEMPTS:-3}
  ABAP_WEBHOOK_RETRY_POLL_SECONDS: ${ABAP_WEBHOOK_RETRY_POLL_SECONDS:-10}
  ABAP_WEBHOOK_RETRY_LEASE_SECONDS: ${ABAP_WEBHOOK_RETRY_LEASE_SECONDS:-30}
  ABAP_WEBHOOK_RETRY_CLAIM_LIMIT: ${ABAP_WEBHOOK_RETRY_CLAIM_LIMIT:-25}
  ABAP_WEBHOOK_MAINTENANCE_INTERVAL_SECONDS: ${ABAP_WEBHOOK_MAINTENANCE_INTERVAL_SECONDS:-3600}
  ABAP_WEBHOOK_DELIVERY_RETENTION_DAYS: ${ABAP_WEBHOOK_DELIVERY_RETENTION_DAYS:-90}

x-application: &application
  image: abap:${ABAP_IMAGE_TAG:-day154}
  build: .
  environment:
    <<: *integration-environment
    DATABASE_BACKEND: postgresql
    DATABASE_URL: ${DATABASE_URL:?Set the deployment PostgreSQL URL with host database}
    ABAP_SESSION_SECRET: ${ABAP_SESSION_SECRET:?Set a random session secret}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-}

services:
  database:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *application
    command: ["python", "-m", "deployment"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  web:
    <<: *application
    restart: unless-stopped
    volumes:
      - activity_logs:/app/logs
      - invoice_documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s

  worker:
    <<: *application
    command: ["python", "-m", "workflow_worker"]
    restart: unless-stopped
    environment:
      <<: *integration-environment
      DATABASE_BACKEND: postgresql
      DATABASE_URL: ${DATABASE_URL:?Set the deployment PostgreSQL URL with host database}
      ABAP_WORKER_ENABLED: "true"
      ABAP_WORKER_POLL_SECONDS: ${ABAP_WORKER_POLL_SECONDS:-5}
      ABAP_WORKER_CLAIM_LIMIT: ${ABAP_WORKER_CLAIM_LIMIT:-25}
      ABAP_WORKER_MAX_ATTEMPTS: ${ABAP_WORKER_MAX_ATTEMPTS:-5}
      ABAP_WORKER_RETRY_BASE_SECONDS: ${ABAP_WORKER_RETRY_BASE_SECONDS:-5}
      ABAP_WORKER_RETRY_MAX_SECONDS: ${ABAP_WORKER_RETRY_MAX_SECONDS:-300}
      ABAP_WORKER_STALE_AFTER_SECONDS: ${ABAP_WORKER_STALE_AFTER_SECONDS:-900}
      ABAP_WORKER_SHUTDOWN_GRACE_SECONDS: ${ABAP_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "workflow_worker", "--check"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s

  webhook-retry-worker:
    <<: *application
    profiles: ["integrations"]
    command: ["python", "-m", "webhook_retry_worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "webhook_retry_worker", "--check"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  database_data:
  activity_logs:
  invoice_documents:
