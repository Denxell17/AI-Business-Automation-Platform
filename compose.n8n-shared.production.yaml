# Apply only with the existing n8n Compose project. This overlay neither
# imports nor activates workflows and never mounts the provider-token file.
services:
  n8n:
    image: sha256:240eaa2a3d491adac5817aa4c3f1c521bb18ec79f6e448517158d5220ee0f37b
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    networks:
      - default
      - abap_n8n_private

networks:
  abap_n8n_private:
    name: abap_n8n_private
    external: true
