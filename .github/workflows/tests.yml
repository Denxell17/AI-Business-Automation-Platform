name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Projects/employee_management_system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Projects/employee_management_system/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run automated tests
        run: python run_tests.py
