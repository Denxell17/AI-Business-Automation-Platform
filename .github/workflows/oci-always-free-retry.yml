name: OCI Always Free capacity retry

on:
  workflow_dispatch:
    inputs:
      create:
        description: "Attempt one VM launch after validation"
        required: true
        type: boolean
        default: false
  schedule:
    # Avoid the start of the hour, when scheduled Actions experience more load.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: abap-oci-always-free-retry
  cancel-in-progress: false

jobs:
  retry:
    name: Validate and attempt once
    if: github.event_name == 'workflow_dispatch' || vars.ABAP_OCI_RETRY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      ABAP_OCI_COMPARTMENT_OCID: ${{ secrets.ABAP_OCI_COMPARTMENT_OCID }}
      ABAP_OCI_SUBNET_OCID: ${{ secrets.ABAP_OCI_SUBNET_OCID }}
      ABAP_OCI_IMAGE_OCID: ${{ secrets.ABAP_OCI_IMAGE_OCID }}
      ABAP_SSH_PUBLIC_KEY: ${{ secrets.ABAP_SSH_PUBLIC_KEY }}
      ABAP_SSH_PUBLIC_KEY_FILE: ${{ github.workspace }}/.abap_ssh_public_key.pub
      ABAP_MAX_ATTEMPTS: "1"
      ABAP_RETRY_SECONDS: "3600"

    steps:
      - name: Enforce the seven-day window
        id: window
        env:
          RETRY_UNTIL_UTC: ${{ vars.ABAP_OCI_RETRY_UNTIL_UTC }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$RETRY_UNTIL_UTC" ]]; then
            echo "Scheduled retry is disabled because ABAP_OCI_RETRY_UNTIL_UTC is unset."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          until_epoch="$(date -u -d "$RETRY_UNTIL_UTC" +%s)" || {
            echo "ABAP_OCI_RETRY_UNTIL_UTC is not a valid UTC timestamp." >&2
            exit 1
          }
          now_epoch="$(date -u +%s)"
          if (( now_epoch >= until_epoch )); then
            echo "The seven-day retry window has ended; no OCI request was made."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "The scheduled retry window is active."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the reviewed retry script
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Verify required secrets exist
        if: steps.window.outputs.active == 'true'
        run: |
          missing=0
          for name in \
            OCI_TENANCY_OCID \
            OCI_USER_OCID \
            OCI_API_KEY_FINGERPRINT \
            OCI_API_PRIVATE_KEY \
            ABAP_OCI_COMPARTMENT_OCID \
            ABAP_OCI_SUBNET_OCID \
            ABAP_OCI_IMAGE_OCID \
            ABAP_SSH_PUBLIC_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done
          (( missing == 0 ))

      - name: Install pinned OCI CLI
        if: steps.window.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check "oci-cli==3.94.0"

      - name: Configure OCI authentication without logging secrets
        if: steps.window.outputs.active == 'true'
        run: |
          set +x
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_API_KEY_FINGERPRINT"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'region=ap-singapore-1\n'
            printf 'key_file=%s/.oci/key.pem\n' "$HOME"
          } > "$HOME/.oci/config"
          printf '%s\n' "$ABAP_SSH_PUBLIC_KEY" > "$ABAP_SSH_PUBLIC_KEY_FILE"

      - name: Check for an existing ABAP instance
        if: steps.window.outputs.active == 'true'
        id: existing
        run: |
          existing_id="$(
            oci compute instance list \
              --compartment-id "$ABAP_OCI_COMPARTMENT_OCID" \
              --display-name abap-production-01 \
              --region ap-singapore-1 \
              --all \
              --query 'data[?"lifecycle-state"!=`TERMINATED`].id | [0]' \
              --raw-output
          )"
          if [[ -n "$existing_id" && "$existing_id" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ABAP already exists; no launch request was made." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate or attempt one launch
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.exists == 'false'
        env:
          CREATE_REQUESTED: ${{ github.event_name == 'schedule' || inputs.create }}
        run: |
          if [[ "$CREATE_REQUESTED" == "true" ]]; then
            export ABAP_CONFIRM_CREATE=YES
          else
            unset ABAP_CONFIRM_CREATE
          fi

          set +e
          bash scripts/oci_retry_always_free.sh
          result=$?
          set -e

          if (( result == 75 )); then
            echo "Oracle A1 capacity is unavailable; the next scheduled run may try again." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( result != 0 )); then
            echo "The safety script stopped on an unexpected error." >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

          if [[ "$CREATE_REQUESTED" == "true" ]]; then
            echo "The ABAP instance launch completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation passed; manual validation created nothing." >> "$GITHUB_STEP_SUMMARY"
          fi
